# ================================================================
# MockPilot AI — Render Deployment Config
# Docs: https://render.com/docs/blueprint-spec
# ================================================================

services:
  - type: web
    name: mockpilot-api
    runtime: python
    region: oregon          # change to singapore/frankfurt if closer
    plan: free              # upgrade to starter ($7/mo) for persistent disk
    buildCommand: pip install -r requirements-backend.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: GROQ_API_KEY
        sync: false         # set manually in Render dashboard

      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      - key: JWT_SECRET_KEY
        generateValue: true # Render auto-generates a secure random value

      - key: JWT_ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

      - key: DATABASE_URL
        value: sqlite:///./mockpilot.db

      - key: WHISPER_MODEL
        value: base

      - key: UPLOAD_DIR
        value: uploads

      - key: REPORTS_DIR
        value: reports

      - key: MAX_UPLOAD_SIZE_MB
        value: "10"

      - key: FRONTEND_URL
        value: ""           # Set to deployed Streamlit frontend URL after deploying frontend
                            # Example: https://mockpilot-frontend.onrender.com

